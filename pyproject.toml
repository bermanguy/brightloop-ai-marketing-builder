[project]
name = "pricewatch"
version = "0.1.0"
description = "Competitor pricing and packaging watch for Maya, Brightloop's Head of Growth"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
# Only the live source needs these; ./run on a cases file uses the standard library.
live = ["httpx>=0.27", "playwright>=1.45"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
