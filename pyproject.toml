[project]
name = "pricewatch"
version = "0.1.0"
description = "Competitor pricing and packaging watch for Maya, Brightloop's Head of Growth"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "httpx2"]  # httpx2: FastAPI's test client
# Only the live source needs these; ./run on a cases file uses the standard library.
live = ["httpx>=0.27", "playwright>=1.45", "anthropic>=2.3"]
# The web app and Postgres (Neon). SQLite needs nothing.
web = ["fastapi>=0.115", "uvicorn>=0.30", "python-multipart>=0.0.9", "psycopg[binary]>=3.2"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
