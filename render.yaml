# Render Blueprint: New > Blueprint, pick this repo. Secrets are entered in Render, never here.
services:
  - type: web
    name: pricewatch
    runtime: docker
    plan: starter  # $7/month, always awake (D22); the free plan sleeps after 15 idle minutes
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL      # Neon connection string
        sync: false
      - key: ANTHROPIC_API_KEY # the AI reader; without it the plain reader runs
        sync: false
      - key: RUN_TOKEN         # protects POST /run (Check now and the schedule)
        sync: false
      # Alerts (notify.py): each channel stays off until its settings are here.
      - key: SMTP_USER         # email through Gmail: the address
        sync: false
      - key: SMTP_PASSWORD     # a Google app password
        sync: false
      - key: RESEND_API_KEY    # or email through Resend
        sync: false
      - key: ALERT_EMAIL_TO    # comma-separated addresses
        sync: false
      - key: SLACK_BOT_TOKEN   # a Slack app's bot token (chat:write), the bot invited to the channel
        sync: false
      - key: SLACK_CHANNEL_ID
        sync: false
      - key: ALERT_MIN_CONFIDENCE
        value: "0.6"
      - key: ALERT_COMPETITORS # empty means all companies
        sync: false
