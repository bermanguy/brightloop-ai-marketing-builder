# Render Blueprint: New > Blueprint, pick this repo. Secrets are entered in Render, never here.
services:
  - type: web
    name: pricewatch
    runtime: docker
    plan: starter  # $7/month, always awake (D22); the free plan sleeps after 15 idle minutes
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL      # Neon connection string
        sync: false
      - key: ANTHROPIC_API_KEY # the AI reader; without it the plain reader runs
        sync: false
      - key: RUN_TOKEN         # protects POST /run (Check now and the schedule)
        sync: false
