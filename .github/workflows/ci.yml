name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -v
      - name: Run the brief's test interface on the sample, with no keys
        run: |
          ./run --input fixtures/sample-cases.json --output result.json
          cat result.json
      - name: One live run from the saved pages, with no keys
        run: |
          ./run --live --pages fixtures/pages/2026-10-25 --no-ai --snapshots /tmp/snaps --output live.json
          python -c "import json; r = json.load(open('live.json')); print(r['run']); assert r['run']['errors'] == []"
