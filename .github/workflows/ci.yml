name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -v
      - name: Run the brief's test interface on the sample, with no keys
        run: |
          ./run --input fixtures/sample-cases.json --output result.json
          cat result.json
