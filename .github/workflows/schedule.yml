name: Live run every 6 hours (backup)

on:
  schedule:
    # A backup: the app starts its own run every 6 hours (SCHEDULE_EVERY_HOURS).
    # GitHub drops many scheduled triggers (3 of 13 fired on the first night); when
    # one fires, the app skips it unless its last run is over 5.5 hours old.
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Wake the app and start a run
        env:
          PRICEWATCH_URL: ${{ secrets.PRICEWATCH_URL }}
          RUN_TOKEN: ${{ secrets.RUN_TOKEN }}
        run: |
          # The free Render instance sleeps; the first request wakes it (about a minute).
          curl -sS --retry 5 --retry-delay 20 --retry-all-errors --max-time 120 "$PRICEWATCH_URL/health"
          curl -sS --fail-with-body --max-time 600 -X POST -H "Authorization: Bearer $RUN_TOKEN" "$PRICEWATCH_URL/run?unless_ran_within_hours=5.5"
